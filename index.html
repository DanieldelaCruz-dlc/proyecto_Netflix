<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra Serie de Netflix</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="netflix-container">
        <div class="hero-image" style="background-image: url('img/fondo-principal.jpg');">
            
            <div class="vignette-overlay"></div> <div class="content">
                <div class="series-logo">
                    <span class="n-logo">N</span> <span class="series-text">S E R I E S</span>
                </div>
                
                <h1 class="title">Unidos por el destino ♥</h1>
                
                <p class="description">
                    Todo comenzó de manera inesperada. Dos mundos chocaron y ahora, 
                    cada día es un capítulo nuevo de la mejor historia jamás escrita. 
                    Protagonizada por Daniel y Yasmin.
                </p>

                <div class="buttons">
                    <button class="btn-play"><i class="fas fa-play"></i> Reproducir</button>
                    <button class="btn-info"><i class="fas fa-info-circle"></i> Más info</button>
                </div>

                <div class="my-list">
                    <h2>Nuestra Lista</h2>
                    <div class="gallery">
                        <img src="img/foto1.jpg" alt="Recuerdo 1">
                        <img src="img/foto2.jpg" alt="Recuerdo 2">
                        <img src="img/foto3.jpg" alt="Recuerdo 3">
                        <img src="img/foto4.jpg" alt="Recuerdo 4">
                        <img src="img/foto5.jpg" alt="Recuerdo 5">
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
